[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmfolio"
version = "0.1.0"
description = "Multi-objective stock portfolio optimization using PSO and genetic algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
swarmfolio = "swarmfolio.cli:main"

[tool.setuptools]
packages = ["swarmfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
